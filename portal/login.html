<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXCO Login — CASOR UNIPORT</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B1F44; --navy-dark:#071531; --gold:#FFC72C; --gold-dark:#E6A800; --cream:#F7F3E8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--navy);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .login-box{
    background:#fff;
    width:100%; max-width:400px;
    padding:44px 36px;
    border-radius:6px;
  }
  .login-box .eyebrow{
    font-family:'Montserrat',sans-serif; font-weight:800; font-size:12px;
    letter-spacing:2px; color:var(--gold-dark); text-transform:uppercase;
    display:block; text-align:center;
  }
  .login-box h1{
    font-family:'Montserrat',sans-serif; font-weight:900; font-size:26px;
    color:var(--navy); text-transform:uppercase; margin:8px 0 28px;
    text-align:center;
  }
  label{ display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px; }
  input{
    width:100%; padding:13px 14px; border:1px solid #ddd; border-radius:4px;
    margin-bottom:18px; font-family:'Poppins',sans-serif; font-size:14px;
  }
  input:focus{ outline:none; border-color:var(--gold-dark); }
  button{
    width:100%; padding:14px; background:var(--gold); color:var(--navy-dark);
    border:none; border-radius:4px; font-family:'Montserrat',sans-serif;
    font-weight:800; text-transform:uppercase; letter-spacing:.5px; font-size:14px;
    cursor:pointer; transition:.25s;
  }
  button:hover{ background:var(--gold-dark); }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .error-msg{
    background:#fdeaea; color:#b3261e; font-size:13px; padding:10px 12px;
    border-radius:4px; margin-bottom:16px; display:none;
  }
  .back-link{
    display:block; text-align:center; margin-top:22px; font-size:13px; color:#888;
  }
  .back-link a{ color:var(--navy); font-weight:600; text-decoration:none; }
  .forgot{ text-align:right; margin:-10px 0 20px; }
  .forgot a{ font-size:12px; color:var(--navy); text-decoration:none; }
</style>
</head>
<body>

<div class="login-box">
  <span class="eyebrow">CASOR UNIPORT</span>
  <h1>EXCO Portal</h1>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@casoruniport.com">

    <label for="password">Password</label>
    <input type="password" id="password" required placeholder="••••••••">

    <div class="forgot"><a href="#" id="forgotLink">Forgot password?</a></div>

    <button type="submit" id="loginBtn">Sign In</button>
  </form>

  <span class="back-link">New EXCO? <a href="signup.html">Create an account</a></span>
  <span class="back-link">Not an EXCO? <a href="../index.html">Return to main site</a></span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const loginBtn = document.getElementById('loginBtn');

// If already logged in AND approved, skip straight to dashboard
auth.onAuthStateChanged(async user => {
  if (!user) return;
  const profile = await db.collection('excos').doc(user.uid).get();
  if (user.emailVerified && profile.exists && profile.data().status === 'approved') {
    window.location.href = 'dashboard.html';
  } else {
    auth.signOut();
  }
});

function attachResendHandler(email, password){
  const link = document.getElementById('resendLink');
  if (!link) return;
  link.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await cred.user.sendEmailVerification();
      await auth.signOut();
      alert('Verification email resent to ' + email);
    } catch (err) {
      alert('Could not resend: ' + friendlyError(err.code));
    }
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    await cred.user.reload();
    await cred.user.getIdToken(true); // force-refresh token to pick up latest emailVerified status

    if (!cred.user.emailVerified) {
      await auth.signOut();
      errorMsg.innerHTML = 'Please verify your email first — check your inbox for the link. <a href="#" id="resendLink">Resend it</a>.';
      errorMsg.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      attachResendHandler(email, password);
      return;
    }

    // Try to auto-approve. This write only succeeds if the security rules
    // confirm this email is on the pre-approved list — otherwise it's denied.
    try {
      await db.collection('excos').doc(cred.user.uid).set({
        status: 'approved',
        email: cred.user.email,
        name: cred.user.displayName || '',
        approvedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch (approveErr) {
      await auth.signOut();
      errorMsg.textContent = "Your email isn't on the approved EXCO list. Contact an admin to be added.";
      errorMsg.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      return;
    }

    window.location.href = 'dashboard.html';
  } catch (err) {
    errorMsg.textContent = friendlyError(err.code);
    errorMsg.style.display = 'block';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
  }
});

document.getElementById('forgotLink').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) { alert('Enter your email above first, then click "Forgot password?" again.'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    alert('Password reset link sent to ' + email);
  } catch (err) {
    alert(friendlyError(err.code));
  }
});

function friendlyError(code){
  const map = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-not-found': 'No account found for that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Try again shortly.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}
</script>

</body>
</html>
