<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXCO Dashboard — CASOR UNIPORT</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B1F44; --navy-dark:#071531; --gold:#FFC72C; --gold-dark:#E6A800; --cream:#F7F3E8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ font-family:'Poppins',sans-serif; background:var(--cream); color:#222; }

  header{
    background:var(--navy); color:#fff; display:flex; align-items:center;
    justify-content:space-between; padding:16px 6%; flex-wrap:wrap; gap:12px;
  }
  header h1{
    font-family:'Montserrat',sans-serif; font-weight:800; font-size:18px;
    text-transform:uppercase; letter-spacing:.5px;
  }
  header h1 span{ color:var(--gold); }
  #userInfo{ display:flex; align-items:center; gap:16px; font-size:13px; color:#cfd6e4; }
  #logoutBtn{
    background:var(--gold); color:var(--navy-dark); border:none; padding:9px 18px;
    border-radius:3px; font-weight:700; font-size:13px; cursor:pointer; text-transform:uppercase;
  }

  main{ max-width:1000px; margin:0 auto; padding:40px 6% 80px; }

  .tabs{ display:flex; gap:10px; margin-bottom:30px; flex-wrap:wrap; }
  .tab-btn{
    padding:10px 22px; border:2px solid var(--navy); background:none; color:var(--navy);
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase;
    border-radius:30px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--navy); color:#fff; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{ background:#fff; border-radius:6px; padding:26px; margin-bottom:20px; box-shadow:0 4px 14px rgba(0,0,0,.05); }
  .card h2{ font-family:'Montserrat',sans-serif; font-size:17px; color:var(--navy); margin-bottom:16px; text-transform:uppercase; }

  input, textarea{
    width:100%; padding:11px 13px; border:1px solid #ddd; border-radius:4px;
    font-family:'Poppins',sans-serif; font-size:14px; margin-bottom:12px;
  }
  textarea{ min-height:90px; resize:vertical; }

  .btn{
    background:var(--gold); color:var(--navy-dark); border:none; padding:11px 24px;
    border-radius:4px; font-family:'Montserrat',sans-serif; font-weight:800; font-size:13px;
    text-transform:uppercase; cursor:pointer;
  }
  .btn:hover{ background:var(--gold-dark); }
  .btn-outline{
    background:none; border:2px solid var(--navy); color:var(--navy); padding:9px 18px;
    border-radius:4px; font-weight:700; font-size:12px; cursor:pointer; text-transform:uppercase;
  }
  .btn-danger{ color:#b3261e; border-color:#b3261e; }

  .list-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 0; border-bottom:1px solid #eee; flex-wrap:wrap;
  }
  .list-item:last-child{ border-bottom:none; }
  .list-item-main{ flex:1; min-width:200px; }
  .list-item-main strong{ display:block; color:var(--navy); font-size:14px; }
  .list-item-main span{ font-size:12px; color:#888; }
  .list-actions{ display:flex; gap:8px; }

  #loadingScreen{
    position:fixed; inset:0; background:var(--navy); color:#fff; display:flex;
    align-items:center; justify-content:center; font-family:'Montserrat',sans-serif;
    font-weight:700; z-index:9999;
  }
</style>
</head>
<body>

<div id="loadingScreen">Loading...</div>

<header>
  <h1>CASOR <span>EXCO Portal</span></h1>
  <div id="userInfo">
    <span id="userEmail"></span>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<main>

  <div class="tabs">
    <button class="tab-btn active" data-panel="filesPanel">Files</button>
    <button class="tab-btn" data-panel="recordsPanel">Records</button>
  </div>

  <!-- FILES PANEL -->
  <div class="panel active" id="filesPanel">
    <div class="card">
      <h2>Upload a File</h2>
      <input type="text" id="fileTitle" placeholder="File title (e.g. 'August Financial Report')">
      <input type="file" id="fileInput">
      <button class="btn" id="uploadBtn">Upload</button>
    </div>

    <div class="card">
      <h2>Shared Files</h2>
      <div id="filesList"><p style="color:#888;font-size:13px;">Loading files...</p></div>
    </div>
  </div>

  <!-- RECORDS PANEL -->
  <div class="panel" id="recordsPanel">
    <div class="card">
      <h2 id="recordFormTitle">Add a Record</h2>
      <input type="hidden" id="recordId">
      <input type="text" id="recordTitle" placeholder="Title (e.g. 'Exec Meeting Minutes — July 2026')">
      <textarea id="recordBody" placeholder="Details / notes..."></textarea>
      <button class="btn" id="saveRecordBtn">Save Record</button>
      <button class="btn-outline" id="cancelEditBtn" style="display:none;margin-left:10px;">Cancel</button>
    </div>

    <div class="card">
      <h2>All Records</h2>
      <div id="recordsList"><p style="color:#888;font-size:13px;">Loading records...</p></div>
    </div>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// ---------- AUTH GUARD ----------
auth.onAuthStateChanged(async user => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  const profile = await db.collection('excos').doc(user.uid).get();
  if (!profile.exists || profile.data().status !== 'approved') {
    alert('Your account is not approved for access yet.');
    await auth.signOut();
    window.location.href = 'login.html';
    return;
  }
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('loadingScreen').style.display = 'none';
  loadFiles();
  loadRecords();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  auth.signOut().then(() => window.location.href = 'login.html');
});

// ---------- TABS ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.panel).classList.add('active');
  });
});

// ---------- FILES ----------
document.getElementById('uploadBtn').addEventListener('click', async () => {
  const title = document.getElementById('fileTitle').value.trim();
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  if (!title || !file) { alert('Add a title and choose a file.'); return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';

  try {
    const path = `files/${Date.now()}_${file.name}`;
    const ref = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();

    await db.collection('files').add({
      title, url, path, fileName: file.name,
      uploadedBy: auth.currentUser.email,
      uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('fileTitle').value = '';
    fileInput.value = '';
    loadFiles();
  } catch (err) {
    alert('Upload failed: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Upload';
  }
});

function loadFiles(){
  db.collection('files').orderBy('uploadedAt', 'desc').onSnapshot(snap => {
    const list = document.getElementById('filesList');
    if (snap.empty) { list.innerHTML = '<p style="color:#888;font-size:13px;">No files yet.</p>'; return; }
    list.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const date = d.uploadedAt ? d.uploadedAt.toDate().toLocaleDateString() : '';
      list.innerHTML += `
        <div class="list-item">
          <div class="list-item-main">
            <strong>${escapeHtml(d.title)}</strong>
            <span>Uploaded by ${escapeHtml(d.uploadedBy || '')} · ${date}</span>
          </div>
          <div class="list-actions">
            <a class="btn-outline" href="${d.url}" target="_blank">View / Download</a>
            <button class="btn-outline btn-danger" onclick="deleteFile('${doc.id}','${d.path}')">Delete</button>
          </div>
        </div>`;
    });
  });
}

async function deleteFile(docId, path){
  if (!confirm('Delete this file for everyone?')) return;
  try {
    await storage.ref(path).delete();
    await db.collection('files').doc(docId).delete();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
}

// ---------- RECORDS ----------
document.getElementById('saveRecordBtn').addEventListener('click', async () => {
  const id = document.getElementById('recordId').value;
  const title = document.getElementById('recordTitle').value.trim();
  const body = document.getElementById('recordBody').value.trim();
  if (!title) { alert('Add a title.'); return; }

  const data = {
    title, body,
    updatedBy: auth.currentUser.email,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    if (id) {
      await db.collection('records').doc(id).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('records').add(data);
    }
    resetRecordForm();
  } catch (err) {
    alert('Save failed: ' + err.message);
  }
});

document.getElementById('cancelEditBtn').addEventListener('click', resetRecordForm);

function resetRecordForm(){
  document.getElementById('recordId').value = '';
  document.getElementById('recordTitle').value = '';
  document.getElementById('recordBody').value = '';
  document.getElementById('recordFormTitle').textContent = 'Add a Record';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

function loadRecords(){
  db.collection('records').orderBy('updatedAt', 'desc').onSnapshot(snap => {
    const list = document.getElementById('recordsList');
    if (snap.empty) { list.innerHTML = '<p style="color:#888;font-size:13px;">No records yet.</p>'; return; }
    list.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const date = d.updatedAt ? d.updatedAt.toDate().toLocaleDateString() : '';
      list.innerHTML += `
        <div class="list-item">
          <div class="list-item-main">
            <strong>${escapeHtml(d.title)}</strong>
            <span>${escapeHtml((d.body||'').slice(0,80))}${d.body && d.body.length>80?'...':''} · updated ${date} by ${escapeHtml(d.updatedBy||'')}</span>
          </div>
          <div class="list-actions">
            <button class="btn-outline" onclick='editRecord("${doc.id}", ${JSON.stringify(d.title)}, ${JSON.stringify(d.body||"")})'>Edit</button>
            <button class="btn-outline btn-danger" onclick="deleteRecord('${doc.id}')">Delete</button>
          </div>
        </div>`;
    });
  });
}

function editRecord(id, title, body){
  document.getElementById('recordId').value = id;
  document.getElementById('recordTitle').value = title;
  document.getElementById('recordBody').value = body;
  document.getElementById('recordFormTitle').textContent = 'Edit Record';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  document.querySelector('[data-panel="recordsPanel"]').click();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteRecord(id){
  if (!confirm('Delete this record?')) return;
  await db.collection('records').doc(id).delete();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
</script>

</body>
</html>
