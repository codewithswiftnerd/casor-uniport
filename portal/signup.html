<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create EXCO Account — CASOR UNIPORT</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B1F44; --navy-dark:#071531; --gold:#FFC72C; --gold-dark:#E6A800; --cream:#F7F3E8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--navy);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .login-box{
    background:#fff;
    width:100%; max-width:400px;
    padding:44px 36px;
    border-radius:6px;
  }
  .login-box .eyebrow{
    font-family:'Montserrat',sans-serif; font-weight:800; font-size:12px;
    letter-spacing:2px; color:var(--gold-dark); text-transform:uppercase;
    display:block; text-align:center;
  }
  .login-box h1{
    font-family:'Montserrat',sans-serif; font-weight:900; font-size:24px;
    color:var(--navy); text-transform:uppercase; margin:8px 0 28px;
    text-align:center;
  }
  label{ display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px; }
  input{
    width:100%; padding:13px 14px; border:1px solid #ddd; border-radius:4px;
    margin-bottom:18px; font-family:'Poppins',sans-serif; font-size:14px;
  }
  input:focus{ outline:none; border-color:var(--gold-dark); }
  button{
    width:100%; padding:14px; background:var(--gold); color:var(--navy-dark);
    border:none; border-radius:4px; font-family:'Montserrat',sans-serif;
    font-weight:800; text-transform:uppercase; letter-spacing:.5px; font-size:14px;
    cursor:pointer; transition:.25s;
  }
  button:hover{ background:var(--gold-dark); }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .error-msg, .success-msg{
    font-size:13px; padding:10px 12px; border-radius:4px; margin-bottom:16px; display:none;
  }
  .error-msg{ background:#fdeaea; color:#b3261e; }
  .success-msg{ background:#e9f7ec; color:#1e7a34; }
  .back-link{
    display:block; text-align:center; margin-top:22px; font-size:13px; color:#888;
  }
  .back-link a{ color:var(--navy); font-weight:600; text-decoration:none; }
  .hint{ font-size:11px; color:#999; margin:-12px 0 18px; }
</style>
</head>
<body>

<div class="login-box">
  <span class="eyebrow">CASOR UNIPORT</span>
  <h1>Create EXCO Account</h1>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="signupForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" required placeholder="Your full name">

    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@casoruniport.com">

    <label for="password">Password</label>
    <input type="password" id="password" required placeholder="At least 6 characters" minlength="6">
    <p class="hint">Your account will need admin approval before you can log in.</p>

    <button type="submit" id="signupBtn">Create Account</button>
  </form>

  <span class="back-link">Already have an account? <a href="login.html">Sign in</a></span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const form = document.getElementById('signupForm');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const signupBtn = document.getElementById('signupBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  signupBtn.disabled = true;
  signupBtn.textContent = 'Creating account...';

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await cred.user.sendEmailVerification();

    // Base profile — status starts unapproved. It only becomes "approved"
    // automatically once they (a) verify their email AND (b) their email
    // is on the admin's pre-approved list — enforced by security rules.
    await db.collection('excos').doc(cred.user.uid).set({
      name, email,
      status: 'unverified',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await auth.signOut();

    form.style.display = 'none';
    successMsg.innerHTML = 'Account created! Check your email (' + email + ') for a verification link, then come back and log in.';
    successMsg.style.display = 'block';
  } catch (err) {
    errorMsg.textContent = friendlyError(err.code);
    errorMsg.style.display = 'block';
    signupBtn.disabled = false;
    signupBtn.textContent = 'Create Account';
  }
});

function friendlyError(code){
  const map = {
    'auth/email-already-in-use': 'An account already exists for that email — try signing in instead.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password should be at least 6 characters.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}
</script>

</body>
</html>
